<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta — Panadería El Horno</title>
<meta name="description" content="Carta digital de la panadería. Pasa las páginas para ver productos, precios y disponibilidad.">
<meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)">

<!-- Único host externo permitido: Google Fonts. Si no carga, hay fallback del sistema. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Karla:wght@400;500;700&display=swap">

<style>
/* ===========================================================================
   1. TOKENS DE COLOR
   Todos los colores viven acá. El set oscuro se redefine más abajo.
   ======================================================================== */
:root {
  color-scheme: light dark;

  --paper:      #FBF6EC;   /* fondo de la página / del body */
  --paper-2:    #F4EBDB;   /* fondo de recuadros */
  --ink:        #241B14;   /* texto principal */
  --ink-soft:   #5B4B3E;   /* descripciones */
  --ink-faint:  #8A7867;   /* texto terciario, notas */
  --accent:     #A8441F;   /* terracota: precios, detalles */
  --accent-ink: #FFF6EE;   /* texto encima del acento */
  --accent-bg:  #EADBCB;   /* fondo suave del acento */
  --rule:       #D9C9B4;   /* líneas y bordes */
  --spine:      rgba(36, 27, 20, .13);  /* sombra del lomo */
  --shadow:     rgba(36, 27, 20, .22);
  --focus:      #0B5FA5;   /* anillo de foco */

  --flip-time:  .62s;
  --flip-ease:  cubic-bezier(.22, .72, .26, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #171310;
    --paper-2:    #221A15;
    --ink:        #F3E8DB;
    --ink-soft:   #C5B4A3;
    --ink-faint:  #93826F;
    --accent:     #E79163;
    --accent-ink: #1C1309;
    --accent-bg:  #342419;
    --rule:       #3C2F26;
    --spine:      rgba(0, 0, 0, .45);
    --shadow:     rgba(0, 0, 0, .55);
    --focus:      #7FC4FF;
  }
}

/* ===========================================================================
   2. BASE
   ======================================================================== */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;          /* nunca scroll horizontal */
}

body {
  background: var(--paper);    /* fondo explícito desde token */
  color: var(--ink);
  font-family: "Karla", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* Foco visible y consistente en todos los controles */
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip: rect(0 0 0 0); clip-path: inset(50%);
  overflow: hidden; white-space: nowrap;
}

/* ===========================================================================
   3. ESCENARIO DEL LIBRO
   ======================================================================== */
.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 0;
  touch-action: pan-y;         /* deja scroll vertical, nos quedamos el horizontal */
  background: var(--paper);
}

.book {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 480px;            /* diseñado para ~400px de ancho */

  /* La perspectiva va acá, en el padre de las hojas, para que el punto de
     fuga quede en el lomo del libro y no en el borde de la pantalla.
     OJO: nada de transform-style: preserve-3d en este nivel — crearía un
     contexto 3D donde los hijos se ordenan por posición y se ignora el
     z-index, que es justo con lo que apilamos las hojas. */
  perspective: 1600px;
  perspective-origin: 0% 50%;
}

/* ---- Cada página ---- */
.page {
  position: absolute;
  inset: 0;
  transform-origin: left center;   /* el lomo está a la izquierda */
  transform-style: preserve-3d;
  transition: transform var(--flip-time) var(--flip-ease);
  will-change: transform;
  pointer-events: none;
}

.page.is-current { pointer-events: auto; }

/* Una página ya pasada queda girada 180° sobre el lomo */
.page.flipped { transform: rotateY(-180deg); }

/* Mientras gira, la página va por encima de todas.
   El z-index se lo pone el JS (inline), porque el inline le gana a esta hoja
   de estilos; acá lo dejamos documentado nada más. */

/* ---- Las dos caras de la página ---- */
.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--paper);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: calc(28px + env(safe-area-inset-top)) 22px calc(104px + env(safe-area-inset-bottom));
}

/* Sombra pegada al lomo: es lo que hace que parezca un libro */
.face::before {
  content: "";
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 30px;
  background: linear-gradient(to right, var(--spine), transparent);
  pointer-events: none;
}

.face.front { transform: rotateY(0deg); }
.face.back  {
  transform: rotateY(180deg);
  background: var(--paper-2);   /* el revés del papel */
}

/* ===========================================================================
   4. CONTENIDO DE LAS PÁGINAS
   ======================================================================== */

/* ---- Portada ---- */
.cover {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  min-height: 100%;
  gap: 18px;
}

.cover-rule {
  width: 54px; height: 2px;
  background: var(--accent);
  border: 0;
}

.cover-kicker {
  font-size: .76rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0;
}

.cover-name {
  font-family: "Fraunces", Georgia, "Times New Roman", serif;
  font-weight: 600;
  font-size: clamp(2.3rem, 13vw, 3.4rem);
  line-height: 1.02;
  margin: 0;
  color: var(--ink);
  text-wrap: balance;
}

.cover-lema {
  font-family: "Fraunces", Georgia, serif;
  font-style: italic;
  font-size: 1.06rem;
  color: var(--ink-soft);
  margin: 0;
  max-width: 24ch;
}

.cover-hint {
  margin-top: 14px;
  font-size: .82rem;
  color: var(--ink-faint);
  display: flex;
  align-items: center;
  gap: 8px;
}

.cover-hint .arrow { animation: nudge 1.8s ease-in-out infinite; }

@keyframes nudge {
  0%, 100% { transform: translateX(0); }
  50%      { transform: translateX(5px); }
}

/* ---- Encabezado de sección ---- */
.sec-head { margin: 0 0 20px; }

.sec-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: .72rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 8px;
}

.sec-kicker::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--rule);
}

.sec-title {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 600;
  font-size: clamp(1.9rem, 9vw, 2.5rem);
  line-height: 1.06;
  margin: 0;
  color: var(--ink);
}

.sec-sub {
  font-family: "Fraunces", Georgia, serif;
  font-style: italic;
  font-size: .98rem;
  color: var(--ink-soft);
  margin: 4px 0 0;
}

/* ---- Lista de productos ---- */
.items { list-style: none; margin: 0; padding: 0; }

.item {
  padding: 13px 0;
  border-bottom: 1px solid var(--rule);
}

.item:last-child { border-bottom: 0; }

/* Fila nombre ····· precio (puntitos clásicos de carta) */
.item-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.item-name {
  font-weight: 700;
  font-size: 1.02rem;
  color: var(--ink);
}

.item-dots {
  flex: 1;
  border-bottom: 1px dotted var(--rule);
  transform: translateY(-4px);
  min-width: 14px;
}

.item-price {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 600;
  font-size: 1.02rem;
  color: var(--accent);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.item-desc {
  margin: 4px 0 0;
  font-size: .88rem;
  color: var(--ink-soft);
  max-width: 42ch;
}

.item-photo {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  border-radius: 8px;
  margin: 10px 0 2px;
  background: var(--paper-2);
}

/* ---- Etiquetas: nuevo / agotado ---- */
.tag {
  display: inline-block;
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 999px;
  margin-left: 7px;
  vertical-align: 2px;
  white-space: nowrap;
}

.tag-nuevo   { background: var(--accent);    color: var(--accent-ink); }
.tag-agotado { background: transparent;      color: var(--ink-faint); border: 1px solid var(--rule); }

/* Producto agotado: atenuado y sin precio */
.item.agotado .item-name,
.item.agotado .item-desc { color: var(--ink-faint); }
.item.agotado .item-name { text-decoration: line-through; text-decoration-thickness: 1px; }
.item.agotado .item-photo { opacity: .45; filter: saturate(.4); }

/* ---- Nota al pie de cada página de carta ---- */
.page-note {
  margin: 22px 0 0;
  font-size: .72rem;
  color: var(--ink-faint);
  text-align: center;
}

/* ---- Contraportada ---- */
.back-page { text-align: center; }

.info-block { margin: 0 0 18px; }

.info-label {
  font-size: .68rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 4px;
}

.info-value {
  font-family: "Fraunces", Georgia, serif;
  font-size: 1.04rem;
  color: var(--ink);
  margin: 0;
}

/* Recuadro para pegar el QR de domicilios / redes */
.qr-slot {
  width: 148px;
  height: 148px;
  margin: 6px auto 10px;
  border: 2px dashed var(--rule);
  border-radius: 12px;
  display: grid;
  place-items: center;
  padding: 10px;
  background: var(--paper-2);
  color: var(--ink-faint);
  font-size: .72rem;
  line-height: 1.35;
}

.thanks {
  font-family: "Fraunces", Georgia, serif;
  font-style: italic;
  font-size: 1.12rem;
  color: var(--ink-soft);
  margin: 24px 0 0;
}

/* ===========================================================================
   5. CONTROLES
   ======================================================================== */

/* Zonas invisibles para pasar página tocando los lados.
   Son franjas en los bordes: el centro queda libre para hacer scroll. */
.tap {
  position: absolute;
  top: 0; bottom: 0;
  width: 20%;
  max-width: 92px;
  z-index: 950;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
}

.tap.prev { left: 0; }
.tap.next { right: 0; }

/* Barra inferior: ‹ ›, puntitos y contador */
.bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--rule);
  box-shadow: 0 6px 22px var(--shadow);
  max-width: calc(100vw - 24px);
}

.arrow-btn {
  flex: none;
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  font-size: 1.15rem;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s ease, color .15s ease;
}

.arrow-btn:hover:not(:disabled) { background: var(--accent-bg); }

.arrow-btn:disabled {
  opacity: .34;
  cursor: default;
}

.dots {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: nowrap;
  overflow: hidden;
}

.dot {
  flex: none;
  width: 22px; height: 22px;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.dot::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--rule);
  transition: background .2s ease, transform .2s ease;
}

.dot[aria-current="true"]::before {
  background: var(--accent);
  transform: scale(1.42);
}

.counter {
  flex: none;
  font-size: .74rem;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  padding: 0 2px;
  min-width: 34px;
  text-align: center;
}

/* ===========================================================================
   6. MOVIMIENTO REDUCIDO
   Si el usuario pide menos animación, el giro es casi instantáneo.
   ======================================================================== */
@media (prefers-reduced-motion: reduce) {
  :root { --flip-time: .001s; }
  .page { transition-duration: .001s; }
  .cover-hint .arrow { animation: none; }
  .dot::before, .arrow-btn { transition: none; }
}

/* Pantallas altas: un poco más de aire */
@media (min-height: 760px) {
  .face { padding-top: 56px; }
}
</style>
</head>

<body>

<!-- El menú se dibuja acá desde menu-data.js -->
<main class="stage" id="stage" aria-label="Carta de la panadería">
  <div class="book" id="book"></div>

  <!-- Franjas laterales para pasar página tocando. Los lectores de pantalla
       usan los botones ‹ › de la barra, así que estas quedan ocultas. -->
  <button class="tap prev" id="tapPrev" tabindex="-1" aria-hidden="true"></button>
  <button class="tap next" id="tapNext" tabindex="-1" aria-hidden="true"></button>
</main>

<!-- Barra de navegación -->
<nav class="bar" aria-label="Navegación de páginas">
  <button class="arrow-btn" id="btnPrev" aria-label="Página anterior">&lsaquo;</button>
  <div class="dots" id="dots" role="tablist" aria-label="Ir a una página"></div>
  <span class="counter" id="counter" aria-hidden="true"></span>
  <button class="arrow-btn" id="btnNext" aria-label="Página siguiente">&rsaquo;</button>
</nav>

<!-- Anuncio para lectores de pantalla al cambiar de página -->
<p class="sr-only" id="live" aria-live="polite"></p>

<!-- Los datos van aparte, en menu-data.js -->
<script src="menu-data.js"></script>

<script>
(function () {
  "use strict";

  /* =========================================================================
     UTILIDADES
     ====================================================================== */

  /** Precio en pesos colombianos, con separador de miles e IVA incluido. */
  var formatoCOP;
  try {
    formatoCOP = new Intl.NumberFormat("es-CO", {
      style: "currency",
      currency: "COP",
      maximumFractionDigits: 0,
    });
  } catch (e) {
    formatoCOP = null;
  }

  function precio(valor) {
    if (typeof valor !== "number" || !isFinite(valor)) return "";
    if (formatoCOP) return formatoCOP.format(valor);
    // Fallback por si Intl no está disponible
    return "$ " + String(Math.round(valor)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  /** Crea un elemento con clase y texto, sin usar innerHTML. */
  function el(tag, clase, texto) {
    var n = document.createElement(tag);
    if (clase) n.className = clase;
    if (texto != null) n.textContent = texto;
    return n;
  }

  /* =========================================================================
     CONSTRUCCIÓN DE LAS PÁGINAS A PARTIR DE menu-data.js
     ====================================================================== */

  var datos = (typeof MENU !== "undefined" && MENU) ? MENU : null;
  var book = document.getElementById("book");

  if (!datos) {
    var aviso = el("p", null, "No se pudo cargar menu-data.js");
    aviso.style.padding = "24px";
    book.appendChild(aviso);
    return;
  }

  var negocio = datos.negocio || {};
  var secciones = Array.isArray(datos.paginas) ? datos.paginas : [];

  /** Cada entrada: { titulo (para el anuncio), construir() -> nodo }. */
  var plan = [];

  // --- 1. Portada ---
  plan.push({
    titulo: "Portada",
    construir: function () {
      var c = el("div", "cover");
      c.appendChild(el("p", "cover-kicker", "Carta"));
      c.appendChild(el("h1", "cover-name", negocio.nombre || "Nuestra carta"));
      c.appendChild(el("hr", "cover-rule"));
      if (negocio.lema) c.appendChild(el("p", "cover-lema", negocio.lema));

      var hint = el("p", "cover-hint");
      hint.appendChild(el("span", null, "Desliza para pasar la página"));
      hint.appendChild(el("span", "arrow", "›"));
      c.appendChild(hint);
      return c;
    },
  });

  // --- 2. Una página por sección de la carta ---
  secciones.forEach(function (sec, i) {
    plan.push({
      titulo: sec.titulo || "Sección",
      construir: function () {
        var wrap = el("div", "menu-page");

        var head = el("header", "sec-head");
        head.appendChild(el("p", "sec-kicker", String(i + 1).padStart(2, "0")));
        head.appendChild(el("h2", "sec-title", sec.titulo || ""));
        if (sec.subtitulo) head.appendChild(el("p", "sec-sub", sec.subtitulo));
        wrap.appendChild(head);

        var lista = el("ul", "items");

        (sec.productos || []).forEach(function (p) {
          var etiqueta = (p.etiqueta || "").toLowerCase();
          var agotado = etiqueta === "agotado";

          var li = el("li", "item" + (agotado ? " agotado" : ""));

          var row = el("div", "item-row");

          var nombre = el("span", "item-name", p.nombre || "");
          if (etiqueta === "nuevo")  nombre.appendChild(el("span", "tag tag-nuevo", "Nuevo"));
          if (agotado)               nombre.appendChild(el("span", "tag tag-agotado", "Agotado"));
          row.appendChild(nombre);

          row.appendChild(el("span", "item-dots"));

          // Los productos agotados se muestran sin precio
          if (!agotado) row.appendChild(el("span", "item-price", precio(p.precio)));

          li.appendChild(row);

          if (p.desc) li.appendChild(el("p", "item-desc", p.desc));

          // Foto opcional (WebP en assets/). Listo para cuando haya fotos.
          if (p.img) {
            var img = document.createElement("img");
            img.className = "item-photo";
            img.src = "assets/" + p.img;
            img.alt = p.nombre ? p.nombre + " de la panadería" : "Producto";
            img.loading = "lazy";
            img.decoding = "async";
            li.appendChild(img);
          }

          lista.appendChild(li);
        });

        wrap.appendChild(lista);
        wrap.appendChild(el("p", "page-note", "Precios en pesos colombianos · IVA incluido"));
        return wrap;
      },
    });
  });

  // --- 3. Contraportada ---
  plan.push({
    titulo: "Horario y contacto",
    construir: function () {
      var c = el("div", "back-page");

      c.appendChild(el("p", "sec-kicker", "Visítanos"));
      c.appendChild(el("h2", "sec-title", negocio.nombre || ""));

      var campos = [
        ["Horario",   negocio.horario],
        ["Dirección", negocio.direccion],
        ["Teléfono",  negocio.telefono],
        ["Redes",     negocio.instagram],
      ];

      campos.forEach(function (par) {
        if (!par[1]) return;
        var b = el("div", "info-block");
        b.appendChild(el("p", "info-label", par[0]));
        b.appendChild(el("p", "info-value", par[1]));
        c.appendChild(b);
      });

      // Recuadro para el QR de domicilios / redes
      var slotLabel = el("p", "info-label", "Domicilios y redes");
      c.appendChild(slotLabel);
      var slot = el("div", "qr-slot");
      slot.appendChild(el("span", null, "Espacio para el QR de domicilios o redes"));
      c.appendChild(slot);

      c.appendChild(el("p", "thanks", "¡Gracias por visitarnos!"));
      return c;
    },
  });

  /* =========================================================================
     PINTAR EL LIBRO
     Cada página es una hoja con cara frontal (contenido) y trasera (papel).
     ====================================================================== */

  var total = plan.length;
  var paginas = [];

  plan.forEach(function (entrada, i) {
    var hoja = el("article", "page");
    hoja.setAttribute("role", "tabpanel");
    hoja.setAttribute("aria-label", "Página " + (i + 1) + " de " + total + ": " + entrada.titulo);

    var front = el("div", "face front");
    front.appendChild(entrada.construir());
    hoja.appendChild(front);

    // Cara trasera: papel en blanco, es lo que se ve a mitad del giro
    hoja.appendChild(el("div", "face back"));

    book.appendChild(hoja);
    paginas.push(hoja);
  });

  /* =========================================================================
     NAVEGACIÓN
     ====================================================================== */

  var actual = 0;
  var animando = false;

  var btnPrev  = document.getElementById("btnPrev");
  var btnNext  = document.getElementById("btnNext");
  var tapPrev  = document.getElementById("tapPrev");
  var tapNext  = document.getElementById("tapNext");
  var dotsWrap = document.getElementById("dots");
  var counter  = document.getElementById("counter");
  var live     = document.getElementById("live");

  // Puntitos de navegación
  var dots = plan.map(function (entrada, i) {
    var d = el("button", "dot");
    d.type = "button";
    d.setAttribute("role", "tab");
    d.setAttribute("aria-label", "Ir a la página " + (i + 1) + ": " + entrada.titulo);
    d.addEventListener("click", function () { irA(i); });
    dotsWrap.appendChild(d);
    return d;
  });

  /** Aplica el estado visual de todas las páginas y controles. */
  function pintar() {
    paginas.forEach(function (hoja, i) {
      var pasada = i < actual;

      hoja.classList.toggle("flipped", pasada);
      hoja.classList.toggle("is-current", i === actual);

      // Las páginas pasadas quedan debajo; las pendientes, encima,
      // con la actual de primera. La hoja que está girando se pone sobre
      // todas para que se vea el giro completo.
      hoja.style.zIndex = hoja.classList.contains("lift")
        ? 900
        : (pasada ? i : 2 * total - i);

      // Solo la página visible se le lee al lector de pantalla
      hoja.setAttribute("aria-hidden", i === actual ? "false" : "true");
    });

    dots.forEach(function (d, i) {
      d.setAttribute("aria-current", i === actual ? "true" : "false");
      d.setAttribute("aria-selected", i === actual ? "true" : "false");
    });

    btnPrev.disabled = actual === 0;
    btnNext.disabled = actual === total - 1;
    counter.textContent = (actual + 1) + "/" + total;
    live.textContent = "Página " + (actual + 1) + " de " + total + ": " + plan[actual].titulo;
  }

  /** Va a una página concreta, levantando la hoja que gira. */
  function irA(destino) {
    if (animando) return;
    destino = Math.max(0, Math.min(total - 1, destino));
    if (destino === actual) return;

    // La hoja que se mueve es la que sale (hacia adelante)
    // o la que vuelve (hacia atrás).
    var moviendo = destino > actual ? paginas[actual] : paginas[destino];

    animando = true;
    moviendo.classList.add("lift");
    actual = destino;
    pintar();

    // Soltamos el bloqueo cuando termina el giro
    var listo = false;
    function fin() {
      if (listo) return;
      listo = true;
      moviendo.classList.remove("lift");
      animando = false;
      moviendo.removeEventListener("transitionend", fin);
      pintar();   // devuelve a la hoja su z-index normal
    }
    moviendo.addEventListener("transitionend", fin);
    // Red de seguridad si el navegador no dispara transitionend
    setTimeout(fin, 750);
  }

  function siguiente() { irA(actual + 1); }
  function anterior()  { irA(actual - 1); }

  btnNext.addEventListener("click", siguiente);
  btnPrev.addEventListener("click", anterior);
  tapNext.addEventListener("click", siguiente);
  tapPrev.addEventListener("click", anterior);

  // --- Teclado ---
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowRight") { siguiente(); }
    else if (ev.key === "ArrowLeft") { anterior(); }
    else if (ev.key === "Home") { irA(0); }
    else if (ev.key === "End") { irA(total - 1); }
    else return;
    ev.preventDefault();
  });

  // --- Swipe ---
  // Solo contamos el gesto como "pasar página" si es claramente horizontal;
  // así el scroll vertical dentro de una página sigue funcionando.
  var x0 = 0, y0 = 0, rastreando = false;

  var stage = document.getElementById("stage");

  stage.addEventListener("touchstart", function (ev) {
    if (ev.touches.length !== 1) { rastreando = false; return; }
    x0 = ev.touches[0].clientX;
    y0 = ev.touches[0].clientY;
    rastreando = true;
  }, { passive: true });

  stage.addEventListener("touchend", function (ev) {
    if (!rastreando) return;
    rastreando = false;

    var t = ev.changedTouches[0];
    var dx = t.clientX - x0;
    var dy = t.clientY - y0;

    if (Math.abs(dx) < 45) return;            // muy corto
    if (Math.abs(dx) < Math.abs(dy) * 1.2) return;  // fue más vertical

    if (dx < 0) siguiente(); else anterior();
  }, { passive: true });

  // Arranque
  pintar();
})();
</script>

</body>
</html>
